<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - InkSpace</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header class="navbar container">

    <a href="index.html" class="logo">
        <span class="logo-icon">✦</span>
        InkSpace
    </a>

    <a href="index.html" class="btn btn-dark small-btn">
        ← Home
    </a>

</header>


<main class="auth-wrapper">

    <section class="auth-card reveal">

        <span class="hero-badge">
            Welcome back
        </span>

        <h1>
            Sign in to InkSpace
        </h1>

        <p>
            Continue writing, reading and discovering
            new ideas.
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label>Email address</label>

                <input
                    type="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="••••••••"
                    required
                >

            </div>


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button class="btn btn-primary full-btn">
                Sign In →
            </button>

        </form>


        <div class="switch-text">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </div>

    </section>

</main>


<script src="./script.js"></script>
<script src="./login.js"></script>
</body>
</html>
